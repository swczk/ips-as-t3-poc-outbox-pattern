name: poc-outbox-pattern

services:
  # ── Infra ──────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/migrations/001_add_dead_letter.sql:/docker-entrypoint-initdb.d/02_dead_letter.sql:ro
      - ./db/migrations/002_remove_eventos_processados.sql:/docker-entrypoint-initdb.d/03_remove_eventos.sql:ro
    networks:
      - poc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-3}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - poc-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - poc-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Aplicação ──────────────────────────────────────────────────────────────

  pedidos-service:
    build:
      context: ./pedidos-service
      dockerfile: Dockerfile
    container_name: pedidos
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?user=${POSTGRES_USER}&password=${POSTGRES_PASSWORD}
      PORT: ${PEDIDOS_PORT:-3000}
    ports:
      - "${PEDIDOS_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - poc-network
    restart: on-failure

  relay-worker:
    build:
      context: ./relay-worker
      dockerfile: Dockerfile
    container_name: relay
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      PEDIDOS_EVENTS_TOPIC: ${PEDIDOS_EVENTS_TOPIC:-pedidos.events}
      POLL_INTERVAL_MS: ${RELAY_POLL_INTERVAL_MS:-1000}
      MAX_TENTATIVAS: ${RELAY_MAX_TENTATIVAS:-5}
      RELAY_BATCH_SIZE: ${RELAY_BATCH_SIZE:-50}
      RECOVERY_INTERVAL_MS: ${RELAY_RECOVERY_INTERVAL_MS:-10000}
      DEAD_LETTER_TOPIC: ${DEAD_LETTER_TOPIC:-dead-letter}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - poc-network
    restart: on-failure

  consumer-service:
    build:
      context: ./consumer-service
      dockerfile: Dockerfile
    container_name: consumer
    environment:
      KAFKA_BROKERS: kafka:9092
      PEDIDOS_EVENTS_TOPIC: ${PEDIDOS_EVENTS_TOPIC:-pedidos.events}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID:-pedidos-consumer-group}
      KAFKA_RETRY_COUNT: ${KAFKA_RETRY_COUNT:-5}
      REDIS_URL: redis://redis:6379
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - poc-network
    restart: on-failure

  # ── Ferramentas de desenvolvimento ────────────────────────────────────────

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    environment:
      DOZZLE_ENABLE_ACTIONS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    ports:
      - "9999:8080"
    networks:
      - poc-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_UI_CLUSTER_NAME:-local}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - poc-network
    depends_on:
      kafka:
        condition: service_healthy

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
    volumes:
      - redis_insight_data:/data
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - poc-network


volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  redis_data:
    driver: local
  redis_insight_data:
    driver: local
  dozzle_data:
    driver: local

networks:
  poc-network:
    driver: bridge
